[snapshot]
command:/usr/local/opnsense/scripts/usagereport/usage-report.py --snapshot
parameters:
type:script
message:Recording IP to device mapping for usage report
description:Usage report: daily IP to device snapshot

[report]
command:/usr/local/opnsense/scripts/usagereport/usage-report.py --json --from
parameters:%s --to %s
type:script_output
message:Building device usage report
